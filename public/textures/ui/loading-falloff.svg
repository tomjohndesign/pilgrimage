<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="none">
  <defs>
    <radialGradient id="falloff">
      <stop offset="0.25" stop-color="white" />
      <stop offset="0.65" stop-color="white" stop-opacity="0.6" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" seed="47" result="noise" />
      <!-- Offset the fade with fixed multiscale noise. Saturated central alpha
           preserves the cells; the noise breaks up only the soft outer band. -->
      <feComposite in="SourceGraphic" in2="noise" operator="arithmetic" k2="1.6" k3="1.1" k4="-0.85" />
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#falloff)" filter="url(#grain)" />
</svg>
